name: Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, mysqli

    - name: Set database environment variables
      run: |
        cat <<'EOF' >> $GITHUB_ENV
        ROMAR_DB_HOST=127.0.0.1
        ROMAR_DB_USER=root
        ROMAR_DB_PASS=root
        ROMAR_DB_NAME=romar_dormitory
        EOF

    - name: Generate .env for deploy preflight
      run: |
        cat > .env <<EOF
        ROMAR_APP_ENV=production
        ROMAR_APP_DEBUG=0
        ROMAR_DB_HOST=$ROMAR_DB_HOST
        ROMAR_DB_USER=$ROMAR_DB_USER
        ROMAR_DB_PASS=$ROMAR_DB_PASS
        ROMAR_DB_NAME=$ROMAR_DB_NAME
        EOF
      shell: bash

    - name: Run Deploy Preflight
      run: php scripts/ops/deploy_preflight.php

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: Automated deploy from commit ${{ github.sha }}.
        draft: false
        prerelease: false

    - name: Deploy to Server (Customize)
      run: |
        echo "Add rsync/FTP here for production server."
        echo "Deploy complete: v${{ github.run_number }}"

    - name: Post-Deploy Health Check
      run: php tests/project_health_check.php

